version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: flavorfusion_postgres
    restart: always
    environment:
      POSTGRES_USER: flavor_user
      POSTGRES_PASSWORD: flavor_password
      POSTGRES_DB: flavorfusion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flavorfusion_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://flavor_user:flavor_password@db:5432/flavorfusion
      - SECRET_KEY=docker-secret-key-flavorfusion-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flavorfusion_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
